name: Desktop gateway CI
on:
  push:
    branches: [desktop, 'upgrade/**']
    tags: ['desktop-v*']
  pull_request:
    branches: [desktop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.4.0'
          cache: npm
      - name: Toolchains
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.99.0
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libssl-dev
          npm install --global npm@11.17.0
      - uses: Swatinem/rust-cache@v2
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo test --locked
      - name: Web client
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          npm ci
          npm run build
          npx tsc --noEmit
      - name: Build gateway
        run: cargo build --release --locked
      - name: Package standalone gateway
        run: |
          mkdir -p artifacts/package
          cp target/release/web-server artifacts/package/
          cp -r dist artifacts/package/
          cp DESKTOP.md artifacts/package/
          git rev-parse HEAD > artifacts/package/SOURCE_COMMIT
          tar -C artifacts/package -czf artifacts/moonlight-web-desktop-linux-amd64.tar.gz .
          (cd artifacts && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: moonlight-web-desktop-linux-amd64
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: moonlight-web-desktop-linux-amd64
          path: artifacts
      - name: Publish gateway
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag \
            --title "Moonlight Web Desktop ${RELEASE_TAG#desktop-v}" \
            --notes 'Linux amd64 gateway and web assets. See DESKTOP.md in the archive for configuration and the pinned Sunshine clipboard protocol.'
